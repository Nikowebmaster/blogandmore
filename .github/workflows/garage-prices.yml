# Aktualisiert einmal pro Woche die Tagespreise im Garagen-Widget (data/garage-prices.json).
# Manuell startbar unter Actions → "Garagenpreise aktualisieren" → Run workflow.
name: Garagenpreise aktualisieren

on:
  schedule:
    - cron: "23 5 * * 1"   # jeden Montag 05:23 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preise auslesen
        run: node tools/update-garage-prices.mjs

      - name: Änderungen speichern
        run: |
          if git diff --quiet -- data/garage-prices.json; then
            echo "Nichts zu speichern."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/garage-prices.json
          git commit -m "Garagenpreise automatisch aktualisiert"
          git push
